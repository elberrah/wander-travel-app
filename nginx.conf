# Wander Travel & Event — Nginx en reverse proxy devant le serveur Node (Next.js)
# L'authentification est vérifiée par l'application : Nginx ne sert plus de fichiers.

# Limitation complémentaire des tentatives sur l'authentification (par IP)
limit_req_zone $binary_remote_addr zone=wander_auth:10m rate=20r/m;

upstream wander_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name wandertravel-event.com www.wandertravel-event.com;
    # Certbot (--nginx) ajoute ici le bloc HTTPS et la redirection 80 -> 443.

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml image/svg+xml font/woff2;

    location /api/auth/ {
        limit_req zone=wander_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://wander_app;
        include /etc/nginx/wander_proxy_params;
    }

    location / {
        proxy_pass http://wander_app;
        include /etc/nginx/wander_proxy_params;
    }
}
