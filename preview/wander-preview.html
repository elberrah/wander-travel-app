','Des expériences pour engager, inspirer et célébrer.') }<div class="package-list">${D.packages.map(p=>`<a href="#/mice/${p.slug}" class="package-row"><span class="package-row-num">${p.number}</span><span class="package-row-title">${p.title}<small>${p.signature}</small></span><span class="package-row-meta">${p.duration} · ${p.participants}</span><span class="package-row-arrow">↗</span></a>`).join('')}</div></div></section>${wow('Chaque programme Wander est conçu autour d’un instant signature, en lien avec les objectifs et les valeurs du collectif.')}<section class="section"><div class="container editorial-grid"><div class="editorial-art" style="background-image:url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1000&q=85')"></div><div class="editorial-copy">${eye('BIEN-ÊTRE & LEADERSHIP')}<h2>Faire une pause.<br><em>Pour aller plus loin.</em></h2><p>Yoga, respiration guidée, sound healing et coaching viennent enrichir certains programmes de cohésion et de leadership.</p>${link('/mice/leadership-retreat','Leadership Retreat','btn btn-outline')}</div></div></section><section class="section proof-section"><div class="container">${heading('NOTRE SAVOIR-FAIRE','Ce qui reste après l’événement.','Des moments conçus avec précision, racontés avec discrétion.') }<div class="proof-grid"><article class="proof-card"><span>ARCHIVES ÉVÉNEMENTIELLES</span><h3>La passion du collectif.</h3><p>Nos expériences Fan Zone passées, sans campagne active ni nom de client.</p>${link('/realisations','Voir les réalisations','underlined-link')}</article><article class="proof-card"><span>MOBILITÉ & HOSPITALITÉ</span><h3>Chaque arrivée compte.</h3><p>Accueil, coordination des transferts et parcours invités maîtrisés.</p>${link('/voyages-corporate','Explorer','underlined-link')}</article></div></div></section>${cta()}`}
function mice(){return hero('WANDER MICE / L’ART DU COLLECTIF','Des rendez-vous qui créent','du mouvement.','Séminaires, conventions, team building, incentives, kickoffs et galas.','https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=1800&q=85')+`<section class="section" id="decouvrir"><div class="container">${heading('SIX SIGNATURES','Le bon format. Au bon moment.','Des expériences entièrement personnalisables.') }<div class="mice-cards">${D.packages.map(p=>`<a href="#/mice/${p.slug}" class="mice-card"><div class="mice-card-photo" style="background-image:linear-gradient(0deg,#000d,transparent),url('${p.hero}')"></div><span class="mice-number">${p.number}</span><div class="mice-card-body">${eye(p.signature)}<h3>${p.title}</h3><p>${p.tagline}</p><div class="mice-card-footer"><span>${p.duration} · ${p.participants}</span><span>↗</span></div></div></a>`).join('')}</div></div></section>`+tiers()+wow('Un instant pensé pour votre entreprise, jamais un effet gratuit.')+cta()}
function tiers(){return `<section class="section section-cream"><div class="container">${heading('SILVER · GOLD · PLATINUM','La même exigence, à votre mesure.','Trois niveaux d’accompagnement adaptables selon votre projet.') }<div class="tier-grid">${D.tiers.map((t,i)=>`<article class="tier ${i===2?'tier-highlight':''}"><span class="tier-index">0${i+1}</span><h3>${t.name}</h3><p>${t.eyebrow}</p><ul>${t.features.map(f=>`<li>${f}</li>`).join('')}</ul>${link('/contact','Recevoir une proposition','underlined-link')}</article>`).join('')}</div><p class="fine-print">Tarifs sur devis, sous réserve de disponibilité et de confirmation.</p></div></section>`}
function packagePage(p){return hero('WANDER MICE / '+p.signature.toUpperCase(),p.title,'by Wander.',p.description,p.hero)+`<div class="container"><div class="facts-row"><div><span>DURÉE</span><strong>${p.duration}</strong></div><div><span>PARTICIPANTS</span><strong>${p.participants}</strong></div><div><span>POUR QUI</span><strong>${p.audience}</strong></div></div></div><section class="section" id="decouvrir"><div class="container">${heading('POURQUOI CE FORMAT',p.tagline,'Une expérience construite autour de votre collectif.') }<div class="benefit-grid">${p.benefits.map((b,i)=>`<article class="benefit"><span>0${i+1}</span><h3>${b}</h3></article>`).join('')}</div></div></section><section class="section section-cream"><div class="container">${heading('NOTRE MÉTHODE','De la première idée au dernier détail.','Une coordination à chaque étape.') }<div class="steps-grid">${p.steps.map((s,i)=>`<article class="step"><span class="step-num">0${i+1}</span><h3>${s.title}</h3><p>${s.text}</p></article>`).join('')}</div></div></section>${wow(esc(p.wow))}${tiers()}${faq(p.faqs)}${cta()}`}
function universPage(path){const p=headers[path],c=content[path];return hero(...p)+`<section class="section" id="decouvrir"><div class="container">${heading(c.ey,c.title,c.text)}<div class="info-grid">${c.cards.map((v,i)=>`<article class="info-card"><span class="info-card-number">0${i+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div>${path==='/kids-juniors'?`<div class="session-banner" style="margin-top:35px">${eye('PREMIÈRE SESSION ANNONCÉE')}<h2>Ifrane · 24 au 31 janvier 2027</h2><p>Programme et disponibilités à confirmer avant inscription.</p>${link('/contact','Se renseigner sur la session')}</div>`:''}${path==='/realisations'?`<p class="preview-notice">Visuels illustratifs. Photographies, jauges et résultats vérifiés à ajouter après validation. Aucune offre Fan Zone active.</p>`:''}</div></section>${wow(c.wow)}${faq([{question:'Comment préparer ce projet avec Wander ?',answer:'Transmettez vos besoins via le formulaire. Notre équipe étudie le périmètre et les disponibilités.'},{question:'Les expériences sont-elles personnalisables ?',answer:'Oui, les formats sont conçus selon les objectifs et les contraintes.'},{question:'Où intervenez-vous ?',answer:'Au Maroc et à l’international, selon la faisabilité du projet.'},{question:'Comment sont définies les conditions ?',answer:'Une proposition écrite est établie et confirmée avant toute réservation.'}])}${cta()}`}
function contact(){return `<section class="contact-page"><div class="container contact-grid"><div class="contact-intro">${eye('WANDER / PRENONS CONTACT')}<h1>Tout commence par <em>une conversation.</em></h1><p>Parlons de votre événement et de la manière dont Wander peut vous accompagner.</p><div class="contact-details"><a href="tel:+212702093107">+212 702 093 107</a><a href="mailto:contact@wandertravel-event.com">contact@wandertravel-event.com</a><p>36 Rue Vevey, Oulad M’Hanna, Casablanca</p></div></div><div class="form-shell"><div class="form-heading">${eye('UNE PREMIÈRE CONVERSATION')}<h2>Concevons votre prochaine expérience.</h2><p>Prévisualisation du formulaire de qualification.</p></div><form class="preview-contact">${[['Nom et prénom','text'],['Fonction','text'],['Entreprise','text'],['E-mail professionnel','email'],['Téléphone','tel']].map(x=>`<label>${x[0]}<input type="${x[1]}" placeholder="${x[0]}"></label>`).join('')}<label>Type de projet<select>${links.slice(0,6).map(l=>`<option>${l[0]}</option>`).join('')}</select></label><label>Message<textarea rows="4" placeholder="Décrivez votre projet"></textarea></label><p class="preview-unavailable">L’envoi est désactivé dans cette prévisualisation hors ligne. Le site Next.js contient un véritable formulaire, à activer avec un endpoint de réception vérifié.</p><button type="button" disabled class="btn btn-gold">Envoi indisponible en prévisualisation</button><p class="form-direct"><a href="mailto:contact@wandertravel-event.com">Écrire à Wander par e-mail</a></p></form></div></div></section>`}
function legal(p){const titles={'/mentions-legales':'Mentions légales','/cgu':'Conditions générales d’utilisation','/confidentialite':'Confidentialité','/cookies':'Politique de cookies'};return `<article class="legal-page container">${eye('INFORMATIONS IMPORTANTES')}<h1>${titles[p]}</h1><p>Cette page est disponible dans le projet Next.js. Ses données réglementaires finales, les mentions de confidentialité et les durées de conservation devront être validées avant publication.</p><h2>Wander Travel & Event</h2><p>36 Rue Vevey, Oulad M’Hanna, Casablanca · contact@wandertravel-event.com</p>${link('/contact','Nous contacter')}</article>`}
function cookies(){if(localStorage.getItem('wander-preview-cookie'))return '';return `<div class="consent-backdrop" id="cookies-dialog"><div class="consent-panel" role="dialog" aria-label="Préférences cookies">${eye('VOTRE CONFIDENTIALITÉ')}<h2>Votre expérience, vos choix.</h2><p>Les trackers ne sont pas chargés dans cette prévisualisation. Découvrez l’interface de consentement.</p><div class="consent-actions"><button data-consent="refuse" class="btn btn-outline">Refuser</button><button data-consent="custom" class="btn btn-outline">Personnaliser</button><button data-consent="accept" class="btn btn-gold">Tout accepter</button></div></div></div>`}
function render(){const route=decodeURI(location.hash.replace(/^#/,'')||'/');let html=route==='/'?home():route==='/mice'?mice():route.startsWith('/mice/')?packagePage(D.packages.find(p=>'/mice/'+p.slug===route)||D.packages[0]):headers[route]?universPage(route):route==='/contact'?contact():legal(route);document.getElementById('root').innerHTML=top()+`<main id="contenu">${html}</main>`+foot()+cookies();let btn=document.getElementById('mobile-btn');btn?.addEventListener('click',()=>{let n=document.getElementById('mobile-menu');n.style.display=n.style.display==='none'?'flex':'none'});document.querySelectorAll('#mobile-menu a').forEach(a=>a.addEventListener('click',()=>document.getElementById('mobile-menu').style.display='none'));let m=document.getElementById('mega'),b=document.getElementById('menu-btn');b?.addEventListener('click',()=>m.style.display=m.style.display==='none'?'grid':'none');document.querySelectorAll('#mega a').forEach(a=>a.addEventListener('click',()=>m.style.display='none'));document.getElementById('manage-cookies')?.addEventListener('click',()=>{localStorage.removeItem('wander-preview-cookie');render()});document.querySelectorAll('[data-consent]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('wander-preview-cookie',b.dataset.consent);document.getElementById('cookies-dialog')?.remove()}));document.querySelectorAll('[data-local-scroll]').forEach(x=>x.addEventListener('click',e=>{e.preventDefault();document.querySelector('#decouvrir')?.scrollIntoView({behavior:'smooth'})}));window.scrollTo({top:0,behavior:'instant'});document.title='Wander · '+(route==='/'?'Accueil':route.replace('/','').replaceAll('-',' '))+' · Prévisualisation';}
window.addEventListener('hashchange',render);render();})();
</script></body></html>
