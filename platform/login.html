<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Connexion — Wander Travel & Event</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 400px at 80% 0,rgba(201,168,76,.22),transparent 60%),#1a0b0f;color:#faf8f5;font:15px/1.5 system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.card{width:min(420px,100%);padding:40px 34px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px)}
h1{font:500 2rem/1.1 Georgia,'Times New Roman',serif;margin:0 0 6px;color:#f3e3b0}p{margin:0 0 24px;color:rgba(250,248,245,.75)}
label{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,245,.75);margin:0 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:inherit;margin-bottom:16px}
input:focus{outline:2px solid #c9a84c;border-color:#c9a84c}
button{width:100%;padding:13px;border:0;border-radius:99px;background:#c9a84c;color:#000;font:700 .95rem system-ui;cursor:pointer}button:hover{background:#f3e3b0}button:disabled{opacity:.6}
.err{min-height:22px;color:#ff9b93;font-size:.88rem;margin:12px 0 0}.foot{margin:22px 0 0;font-size:.82rem;color:rgba(250,248,245,.75)}a{color:#f3e3b0}[hidden]{display:none!important}
</style></head><body>
<div class="card"><h1>Wander</h1><p id="sub">Accès réservé aux salariés des entreprises partenaires.</p>
<form id="f"><label for="id">Identifiant</label><input id="id" autocomplete="username" required>
<label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required>
<button id="go">Se connecter</button></form>
<form id="s" hidden><label for="fn">Prénom</label><input id="fn" autocomplete="given-name" required><label for="ln">Nom</label><input id="ln" autocomplete="family-name" required>
<label for="em">Email professionnel</label><input id="em" type="email" autocomplete="email" required><label for="co">Entreprise</label><input id="co" autocomplete="organization">
<button id="sg">Créer mon accès</button></form>
<form id="fg" hidden><label for="fe">Email</label><input id="fe" type="email" required><button id="fb">Recevoir un nouveau mot de passe</button></form>
<div class="err" id="err"></div>
<p class="foot"><a href="#" data-v="f">Connexion</a> · <a href="#" data-v="s">Créer mon accès</a> · <a href="#" data-v="fg">Mot de passe oublié</a><br><br>Besoin d'aide ? <a href="https://wa.me/212702093107">WhatsApp</a></p></div>
<script>window.SYNC_PUBLIC=true;</script><script src="sync.js"></script>
<script>
const $=i=>document.getElementById(i),err=$('err'),forms={f:$('f'),s:$('s'),fg:$('fg')};
function show(v){Object.keys(forms).forEach(k=>forms[k].hidden=k!==v);err.textContent='';err.style.color=''}
document.querySelectorAll('[data-v]').forEach(a=>a.onclick=e=>{e.preventDefault();show(a.dataset.v)});
const ok=m=>{err.style.color='#9be3b5';err.textContent=m};
async function run(btn,label,fn){err.textContent='';btn.disabled=true;btn.textContent='Envoi…';try{await fn()}finally{btn.disabled=false;btn.textContent=label}}
if(!Sync.url){err.textContent='Connexion non configurée : le site est en accès libre.';$('go').textContent='Entrer sur le site';forms.f.onsubmit=e=>{e.preventDefault();location.href='index.html'}}
else{
 forms.f.onsubmit=e=>{e.preventDefault();run($('go'),'Se connecter',async()=>{
  const r=await Sync.post({action:'login',id:$('id').value,pw:$('pw').value});
  if(!r||!r.ok){err.textContent=r?'Identifiant ou mot de passe incorrect.':'Connexion impossible. Réessayez.';return}
  localStorage.setItem('wander_session',JSON.stringify(r));
  const n=new URLSearchParams(location.search).get('next')||'index.html';location.replace(/^[\w.-]+(\?.*)?$/.test(n)?n:'index.html')})};
 forms.s.onsubmit=e=>{e.preventDefault();run($('sg'),'Créer mon accès',async()=>{
  const r=await Sync.post({action:'signup',fn:$('fn').value,ln:$('ln').value,em:$('em').value,co:$('co').value});
  if(!r)return err.textContent='Connexion impossible. Réessayez.';
  if(r.error==='exists')return err.textContent='Cet email a déjà un accès. Utilisez « Mot de passe oublié ».';
  if(!r.ok)return err.textContent='Vérifiez vos informations.';
  ok(r.status==='active'?'Accès créé. Vos identifiants viennent d\u2019être envoyés par email.':'Demande reçue. Un email de confirmation vous est envoyé, puis vos identifiants après validation.')})};
 forms.fg.onsubmit=e=>{e.preventDefault();run($('fb'),'Recevoir un nouveau mot de passe',async()=>{await Sync.post({action:'forgot',em:$('fe').value});ok('Si cet email a un accès, un nouveau mot de passe vient d\u2019être envoyé.')})};
}
</script></body></html>
