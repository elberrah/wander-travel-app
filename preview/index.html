 dest('01','MAROC · PATRIMOINE & NATURE','Découvrir le Maroc autrement','Villes impériales, nature et savoir-faire : des itinéraires qui mettent les connaissances en mouvement.','maroc-nature.webp','Paysage de montagne au Maroc',true)+
 dest('02','ESPAGNE · CULTURES CROISÉES','Andalousie & patrimoine','Explorer la rencontre des héritages, des arts et de l’architecture dans un parcours culturel accompagné.','marbella-andalousie.webp','Ruelle méditerranéenne fleurie : illustration d’un séjour en Espagne')+
 dest('03','TURQUIE · CULTURES DU MONDE','Istanbul, les horizons s’ouvrent','Un voyage de découverte historique et culturelle, construit autour des objectifs pédagogiques de l’établissement.','istanbul-patrimoine.webp','Vue urbaine d’Istanbul et du Bosphore')+
 `<article class="scolaire-destination-card scolaire-destination-text"><div class="scolaire-destination-copy">${eye('04 / ESPAGNE · LANGUES & OUVERTURE')}<span class="scolaire-icon-texte">✧</span><h3>Marbella & immersion linguistique</h3><p>Un format associant pratique linguistique et découverte du quotidien, à préciser avec l’équipe enseignante.</p></div><div class="scolaire-destination-outline">LANGUES · CULTURE · DÉCOUVERTE</div></article></div>`+
 `<div class="scolaire-graduation"><span class="scolaire-grad-symbol">✦</span><div>${eye('LE PROGRAMME SUR MESURE')}<h3>Voyage de fin d’études</h3><p>Une expérience de groupe pensée pour marquer une étape et célébrer un parcours, dans la destination choisie avec l’établissement.</p></div>${link('/contact','Étudier le programme','btn btn-outline')}</div><p class="fine-print">Photographies d’illustration. Destinations, modalités et disponibilités sous réserve d’étude et de confirmation avant réservation.</p></div></section>`+
 `<section class="section scolaire-equitation"><div class="container scolaire-equitation-grid"><div class="scolaire-equitation-photos">${photo('equitation-decouverte.webp','Illustration d’activité équestre sans enfant identifiable')}<span>EXPÉRIENCES AU GRAND AIR</span></div><div class="scolaire-equitation-copy">${eye('DÉCOUVERTE & NATURE')}<h2>Rencontrer le vivant. <em>Apprendre par l’expérience.</em></h2><p>La découverte du cheval peut donner lieu à une expérience pédagogique autour du respect de l’animal, de la confiance et de l’observation. Les activités équestres sont proposées seulement lorsqu’elles sont adaptées à l’âge du groupe et aux conditions d’encadrement.</p><div class="scolaire-equitation-notes"><div><span>◇</span> Découverte du cheval et de son environnement</div><div><span>◇</span> Activités adaptées au groupe scolaire</div><div><span>◇</span> Matériel et modalités de sécurité à confirmer</div></div>${link('/contact','Construire une visite avec Wander','text-link')}</div></div></section>`+
 `<section class="section section-cream scolaire-organisation"><div class="container">${heading('UN VOYAGE PRÉPARÉ ENSEMBLE','L’attention portée à chaque détail.','L’équipe Wander conçoit le dispositif avec votre établissement. Aucun service de transport, d’accompagnement ou d’assurance n’est annoncé comme automatiquement inclus avant proposition écrite.')}<div class="steps-grid">${[['Le projet','Objectifs éducatifs, tranche d’âge, dates et effectif.'],['La conception','Programme, lieux, transport et faisabilité du parcours.'],['La préparation','Encadrement, autorisations, conditions de sécurité et informations aux familles.'],['Le voyage','Coordination des prestations convenues et suivi du déroulé.']].map((it,i)=>`<article class="step"><span class="step-num">0${i+1}</span><h3>${it[0]}</h3><p>${it[1]}</p></article>`).join('')}</div></div></section>`+
 wow('Une découverte architecturale, un atelier avec un artisan ou une rencontre avec le monde équestre : l’instant qui transforme une leçon en souvenir durable.')+
 faq([{question:'Le programme suit-il nos objectifs pédagogiques ?',answer:'Oui. Le parcours est étudié à partir des objectifs et contraintes transmis par votre équipe enseignante.'},{question:'Quelles destinations peut-on envisager ?',answer:'Le Maroc, l’Andalousie, Istanbul et l’Espagne sont des pistes, selon faisabilité et disponibilités.'},{question:'Comment est organisé l’encadrement des élèves ?',answer:'Les responsabilités, effectifs d’encadrants, conditions de sécurité et autorisations sont définis avec l’établissement.'},{question:'Peut-on intégrer une activité équestre ?',answer:'Oui, sous réserve de l’âge des élèves, de la faisabilité, des équipements et des exigences de sécurité.'},{question:'Les photos représentent-elles des voyages Wander ?',answer:'Non. Les photographies illustrent des types de destinations et d’activités sans identifier d’élève ou de client.'}])+
 `<section class="cta-section"><div class="container cta-inner"><div>${eye('WANDER SCOLAIRE · CASABLANCA')}<h2>Leur prochain voyage commence avec votre projet pédagogique.</h2><p>Nous étudierons le programme avec votre établissement.</p></div>${link('/contact','Demander un programme scolaire')}</div></section>`;
}
function universPage(path){const p=headers[path],c=content[path];return hero(...p)+`<section class="section" id="decouvrir"><div class="container">${heading(c.ey,c.title,c.text)}<div class="info-grid">${c.cards.map((v,i)=>`<article class="info-card"><span class="info-card-number">0${i+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div>${path==='/kids-juniors'?`<div class="session-banner" style="margin-top:35px">${eye('PREMIÈRE SESSION ANNONCÉE')}<h2>Ifrane · 24 au 31 janvier 2027</h2><p>Programme et disponibilités à confirmer avant inscription.</p>${link('/contact','Se renseigner sur la session')}</div>`:''}${path==='/realisations'?`<p class="preview-notice">Visuels illustratifs. Photographies, jauges et résultats vérifiés à ajouter après validation. Aucune offre Fan Zone active.</p>`:''}</div></section>${wow(c.wow)}${faq([{question:'Comment préparer ce projet avec Wander ?',answer:'Transmettez vos besoins via le formulaire. Notre équipe étudie le périmètre et les disponibilités.'},{question:'Les expériences sont-elles personnalisables ?',answer:'Oui, les formats sont conçus selon les objectifs et les contraintes.'},{question:'Où intervenez-vous ?',answer:'Au Maroc et à l’international, selon la faisabilité du projet.'},{question:'Comment sont définies les conditions ?',answer:'Une proposition écrite est établie et confirmée avant toute réservation.'}])}${cta()}`}

 return hero('WANDER / TRIANGLE D’OR','Quand Casablanca','devient une expérience.','Lumière, culture et rencontres : des concepts événementiels à imaginer avec Wander.',triangleMedia('promenade-lumineuse.webp'),'Imaginer mon événement')+
 `<section class="section" id="decouvrir"><div class="container">${heading('CASABLANCA · CULTURE & ÉVÉNEMENTIEL','Une ville qui s’illumine. Des émotions qui rassemblent.','Une expérience urbaine construite autour du lieu, des invités, de la scénographie et de la fluidité de chaque instant.')}
 <div class="triangle-service-grid">${[['Scénographie & atmosphère','Décor, illuminations et parcours invités.'],['Performances culturelles','Musique, arts et interventions sur mesure.'],['Hospitalité & gastronomie','Espaces d’accueil et rencontres autour de la table.'],['Coordination du dispositif','Préparation technique et parcours opérationnel.']].map((v,i)=>`<article class="triangle-service-card"><span>0${i+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div></div></section>
 <section class="section triangle-gallery"><div class="container">${heading('INSPIRATIONS','L’esprit Triangle d’Or.','Visuels de direction artistique et non photographies vérifiées de réalisations Wander.')}<div class="triangle-gallery-grid"><figure class="triangle-feature"><img src="${triangleMedia('triangle-or-concept.webp')}" alt="Illustration conceptuelle d’une promenade culturelle à Casablanca" loading="lazy"><figcaption>CONCEPT VISUEL · PROMENADE CULTURELLE</figcaption></figure><figure class="triangle-secondary"><img src="${triangleMedia('casablanca-soir.webp')}" alt="Illustration de Casablanca au crépuscule" loading="lazy"><figcaption>INSPIRATION · CASABLANCA EN LUMIÈRE</figcaption></figure></div><p class="fine-print">Images illustratives : droits commerciaux et usage public à confirmer.</p></div></section>`+

 faq([{question:'S’agit-il d’un événement annoncé ?',answer:'Non, cette page présente un univers créatif et des exemples de concepts, sans calendrier commercial actif.'},{question:'Pouvez-vous créer un événement privé ?',answer:'Chaque demande est étudiée selon son lieu, son public, ses objectifs et les autorisations nécessaires.'},{question:'Peut-on demander une proposition ?',answer:'Oui, l’équipe Wander peut étudier une proposition personnalisée selon les disponibilités.'}])+cta()
}

 return hero('WANDER / VIP & AVIATION','L’art d’arriver.','Le privilège du détail.','Accueil VIP, conciergerie, véhicules avec chauffeur et aviation privée sur demande.',corporateMedia('interieur-prestige.webp'))+
 `<section class="section" id="decouvrir"><div class="container">${heading('NOS PRESTATIONS','Une expérience fluide, de porte à porte.','Prestations disponibles uniquement selon les confirmations de faisabilité et les opérateurs autorisés.')}
 <div class="vip-offers">${card('flotte-prestige.webp','Transferts prestige','Véhicules avec chauffeur et transferts adaptés aux dirigeants et délégations.')}${card('salon-aeroport.webp','Accueil & conciergerie','Parcours d’accueil et assistance selon les services accessibles dans les aéroports.')}${card('avion-decollage.webp','Aviation privée','Étude sur mesure sans annoncer de disponibilité ni de tarif non confirmés.')}</div></div></section>`+wow('L’attention discrète qui transforme votre arrivée en expérience sereine.')+cta();

function contact(){return `<section class="contact-page"><div class="container contact-grid"><div class="contact-intro">${eye('WANDER / PRENONS CONTACT')}<h1>Tout commence par <em>une conversation.</em></h1><p>Parlons de votre événement et de la manière dont Wander peut vous accompagner.</p><div class="contact-details"><a href="tel:+212702093107">+212 702 093 107</a><a href="mailto:contact@wandertravel-event.com">contact@wandertravel-event.com</a><p>36 Rue Ouled Mhanna, RDC Mag. 02, Casablanca</p></div></div><div class="form-shell"><div class="form-heading">${eye('UNE PREMIÈRE CONVERSATION')}<h2>Concevons votre prochaine expérience.</h2><p>Prévisualisation du formulaire de qualification.</p></div><form class="preview-contact">${[['Nom et prénom','text'],['Fonction','text'],['Entreprise','text'],['E-mail professionnel','email'],['Téléphone','tel']].map(x=>`<label>${x[0]}<input type="${x[1]}" placeholder="${x[0]}"></label>`).join('')}<label>Type de projet<select>${links.slice(0,7).map(l=>`<option>${l[0]}</option>`).join('')}</select></label><label>Message<textarea rows="4" placeholder="Décrivez votre projet"></textarea></label><p class="preview-unavailable">L’envoi est désactivé dans cette prévisualisation hors ligne. Le site Next.js contient un véritable formulaire, à activer avec un endpoint de réception vérifié.</p><button type="button" disabled class="btn btn-gold">Envoi indisponible en prévisualisation</button><p class="form-direct"><a href="mailto:contact@wandertravel-event.com">Écrire à Wander par e-mail</a></p></form></div></div></section>`}
function legal(p){const titles={'/mentions-legales':'Mentions légales','/cgu':'Conditions générales d’utilisation','/confidentialite':'Confidentialité','/cookies':'Politique de cookies'};return `<article class="legal-page container">${eye('INFORMATIONS IMPORTANTES')}<h1>${titles[p]}</h1><p>Cette page est disponible dans le projet Next.js. Ses données réglementaires finales, les mentions de confidentialité et les durées de conservation devront être validées avant publication.</p><h2>Wander Travel & Event</h2><p>36 Rue Ouled Mhanna, RDC Mag. 02, Casablanca · contact@wandertravel-event.com</p>${link('/contact','Nous contacter')}</article>`}
function cookies(){if(previewStorage.getItem('wander-preview-cookie'))return '';return `<div class="consent-backdrop" id="cookies-dialog"><div class="consent-panel" role="dialog" aria-label="Préférences cookies">${eye('VOTRE CONFIDENTIALITÉ')}<h2>Votre expérience, vos choix.</h2><p>Les trackers ne sont pas chargés dans cette prévisualisation. Découvrez l’interface de consentement.</p><div class="consent-actions"><button data-consent="refuse" class="btn btn-outline">Refuser</button><button data-consent="custom" class="btn btn-outline">Personnaliser</button><button data-consent="accept" class="btn btn-gold">Tout accepter</button></div></div></div>`}
function render(){const route=decodeURI(location.hash.replace(/^#/,'')||'/');let html=route==='/'?home():route==='/mice'?mice():route.startsWith('/mice/')?packagePage(D.packages.find(p=>'/mice/'+p.slug===route)||D.packages[0]):route==='/voyages-corporate'?corporatePage():route==='/avantages-salaries'?avantagesPage():route==='/kids-juniors'?kidsPage():route==='/scolaire'?scolairePage():route==='/triangle-dor'?trianglePage():route==='/vip'?vipPage():headers[route]?universPage(route):route==='/contact'?contact():legal(route);document.getElementById('root').innerHTML=top()+`<main id="contenu">${html}</main>`+foot()+cookies();let btn=document.getElementById('mobile-btn');btn?.addEventListener('click',()=>{let n=document.getElementById('mobile-menu');n.style.display=n.style.display==='none'?'flex':'none'});document.querySelectorAll('#mobile-menu a').forEach(a=>a.addEventListener('click',()=>document.getElementById('mobile-menu').style.display='none'));let m=document.getElementById('mega'),b=document.getElementById('menu-btn');b?.addEventListener('click',()=>m.style.display=m.style.display==='none'?'grid':'none');document.querySelectorAll('#mega a').forEach(a=>a.addEventListener('click',()=>m.style.display='none'));document.getElementById('manage-cookies')?.addEventListener('click',()=>{previewStorage.removeItem('wander-preview-cookie');render()});document.querySelectorAll('[data-consent]').forEach(b=>b.addEventListener('click',()=>{previewStorage.setItem('wander-preview-cookie',b.dataset.consent);document.getElementById('cookies-dialog')?.remove()}));document.querySelectorAll('[data-local-scroll]').forEach(x=>x.addEventListener('click',e=>{e.preventDefault();document.querySelector('#decouvrir')?.scrollIntoView({behavior:'smooth'})}));window.scrollTo({top:0,behavior:'instant'});document.title='Wander · '+(route==='/'?'Accueil':route.replace('/','').replaceAll('-',' '))+' · Prévisualisation';}
window.addEventListener('hashchange',render);render();})();
</script></body></html>
